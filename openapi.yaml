openapi: 3.0.3
info:
  title: Coordinateur d'apprentissage fédéré
  description: |
    API de plan de contrôle pour tours d'apprentissage fédéré.
    Identité client : paramètre `client_id` (query) pour GET parameters ;
    corps JSON pour POST contributions (pas de jeton OAuth).
  version: 1.0.0

components:
  schemas:
    ClientInscription:
      type: object
      required: [id, data_size, capacity]
      properties:
        id:
          type: string
          example: client-001
        data_size:
          type: integer
          minimum: 1
          example: 1500
        capacity:
          type: number
          exclusiveMinimum: 0
          example: 4.2
        reliability:
          type: number
          minimum: 0
          maximum: 1
          default: 1.0
          example: 0.92
    ContributionData:
      type: object
      required: [client_id, vector, data_size, duration_s, completed]
      properties:
        client_id:
          type: string
        vector:
          type: array
          items:
            type: number
          minItems: 8
          maxItems: 8
        data_size:
          type: integer
          minimum: 1
        duration_s:
          type: number
          minimum: 0
        completed:
          type: boolean
    Erreur:
      type: object
      properties:
        erreur:
          type: string
        code:
          type: string
        tour_id:
          type: integer

paths:
  /v1/clients:
    post:
      summary: Inscrire un client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInscription'
      responses:
        '201':
          description: Client inscrit
        '409':
          description: Client déjà inscrit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'

  /v1/clients/{id}:
    delete:
      summary: Désinscrire un client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Client désinscrit
        '404':
          description: Client inexistant

  /v1/round:
    get:
      summary: Consulter le tour actuel
      responses:
        '200':
          description: État du tour (id, statut, modèle, sélection)

  /v1/round/start:
    post:
      summary: Démarrer un tour (sélection + ouverture des contributions)
      responses:
        '200':
          description: Tour démarré
        '400':
          description: Aucun client inscrit

  /v1/round/{id}/parameters:
    get:
      summary: Récupérer le modèle global
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: Identité déclarée du client (pas de token)
      responses:
        '200':
          description: Modèle retourné
        '403':
          description: Client non sélectionné
        '404':
          description: Tour inexistant
        '409':
          description: Tour déjà clôturé

  /v1/round/{id}/contributions:
    post:
      summary: Déposer une contribution (clôture éventuelle + FedAvg)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributionData'
      responses:
        '201':
          description: Contribution reçue (peut clôturer le tour)
        '403':
          description: Client non autorisé
        '404':
          description: Tour inexistant
        '409':
          description: Tour clôturé ou contribution déjà envoyée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
              example:
                erreur: "contribution hors délai : tour clôturé"
                code: ROUND_CLOSED
                tour_id: 3

  /v1/metrics:
    get:
      summary: Métriques (compteurs + Gini sur l'historique des sélections)
      responses:
        '200':
          description: |
            Retourne tour_id, statut, compteurs et gini_selections
            (coefficient de Gini sur le nombre de sélections par client).
